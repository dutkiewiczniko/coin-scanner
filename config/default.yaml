# euro-vision configuration, set up for the current rig.
# Copy and edit, then pass with `euro-vision <cmd> --config my.yaml`.

calibrate:
  enabled: true
  # Clockwise as they appear in a side-a photo, starting from the corner that
  # becomes the top-left of the rectified image. Orange is separable from Nordic
  # gold coins on saturation (paint ~190, coins ~100), not on hue alone.
  markers: [orange, red, blue, green]

  # Marker centre-to-centre, NOT the tray's outer size — the marks sit on the
  # rim, so the two differ by most of the wall thickness.
  #
  # Side A is the larger tray ("Top End Columns", 213.9 x 219.9 outer, 4 mm
  # wall, R11 corners); side B is Coin Tray v3 (210 x 210 outer). The pair are
  # deliberately different sizes so one nests inside the other for sliding coins
  # across, which is why each needs its own figure. Values below are mid-rim,
  # derived from the CAD; refine with `euro-vision measure`.
  tray_width_mm: 204.63
  tray_height_mm: 210.63
  tray_b_width_mm: 200.73
  tray_b_height_mm: 200.73

  pixels_per_mm: 12.0
  min_marker_area: 40
  scale_correction: 1.0

segment:
  # Watershed splits touching coins; hough double-detects them on a full tray.
  backend: watershed
  # Otsu reads high on a tray that is ~70% metal and loses the darker coppers.
  coin_threshold: 75
  radial_measure: true
  radial_edge_fraction: 0.40
  watershed_seed_ratio: 0.62
  min_diameter_mm: 15.0
  max_diameter_mm: 27.0
  crop_padding: 0.08

normalise:
  size: 224
  circular_mask: true
  rotation_method: none
  pixels_per_mm: null   # derived from the calibration

classify:
  backend: diameter
  min_confidence: 0.5

rare:
  backend: shortlist
  denominations: [100, 200]
  database: data/rare_coins.sqlite
  flag_threshold: 0.80

pair:
  # The trays nest rather than meeting corner to corner, so their frames sit at
  # a fixed offset. This recovers it from the coins instead of measuring it.
  auto_align: true
  max_offset_mm: 8.0
  max_diameter_delta_mm: 1.2
  composite_face_px: 320

output_dir: data/out
save_crops: false
