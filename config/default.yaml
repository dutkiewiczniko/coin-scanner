# euro-vision configuration, set up for the current rig.
# Copy and edit, then pass with `euro-vision <cmd> --config my.yaml`.

calibrate:
  enabled: true
  # Clockwise as they appear in a side-a photo, starting from the corner that
  # becomes the top-left of the rectified image. Orange is separable from Nordic
  # gold coins on saturation (paint ~190, coins ~100), not on hue alone.
  markers: [orange, red, blue, green]

  # Marker centre-to-centre, NOT the tray's outer size — the marks sit on the
  # rim, so the two differ by most of the wall thickness.
  #
  # Side A is the larger tray ("Top End Columns", 213.9 x 219.9 outer, 4 mm
  # wall, R11 corners); side B is Coin Tray v3 (210 x 210 outer). The pair are
  # deliberately different sizes so one nests inside the other for sliding coins
  # across, which is why each needs its own figure. Values below are mid-rim,
  # derived from the CAD; refine with `euro-vision measure`.
  tray_width_mm: 204.63
  tray_height_mm: 210.63
  tray_b_width_mm: 200.73
  tray_b_height_mm: 200.73

  pixels_per_mm: 12.0
  min_marker_area: 40
  scale_correction: 1.0

segment:
  # Watershed splits touching coins; hough double-detects them on a full tray.
  backend: watershed
  # Otsu reads high on a tray that is ~70% metal and loses the darker coppers.
  coin_threshold: 75
  radial_measure: true
  # Where along the coin-to-tray brightness drop a ray calls the edge. At 0.40 it
  # stopped inside the coin's dim outer rim and every coin read 0.52 mm small,
  # which cost 28 points of denomination accuracy on the graded batch (56% ->
  # 84%). Measured over 50 hand-graded faces: bias -0.04 mm here, and no scale
  # correction needed. Do not go below 0.06 — the threshold then sits so close to
  # tray level that rays run on into touching neighbours and the spread explodes
  # from 0.45 mm to 2.46 mm.
  radial_edge_fraction: 0.10
  watershed_seed_ratio: 0.62
  min_diameter_mm: 15.0
  max_diameter_mm: 27.0
  crop_padding: 0.08

normalise:
  size: 224
  circular_mask: true
  rotation_method: none
  pixels_per_mm: null   # derived from the calibration

classify:
  # Alloy from colour, then nearest size within that alloy. On 48 hand-graded
  # coins from batch 101, deciding each coin from both its faces:
  #   diameter  44/48  91.7%
  #   metal     46/48  95.8%   (alloy itself 47/48)
  # A ResNet18 fine-tuned on 2,760 public coin images reached 52% on held-out
  # designs and 50% here, because a Euro's national side does not carry its
  # denomination — Ireland uses the same harp on all eight. The model recovered
  # the alloy (94.3%) and little else, which is exactly what colour gives for
  # free.
  backend: metal
  metal_model: models/metal_group.json
  min_confidence: 0.5

rare:
  # Geometric striking faults — clipped planchets, off-centre strikes,
  # broadstrikes. These cannot be looked up: a catalogue says which *issue* is
  # scarce, while an error belongs to one particular coin. Catalogue rarity is
  # the separate `metadata` backend, still to be built on top of the issue table
  # loaded by `euro-vision db import-commemoratives`.
  backend: errors
  error_threshold: 0.5
  # Every denomination is checked for striking faults regardless of this list;
  # it only limits the catalogue-based backends, where a 2 EUR is worth looking
  # up and a 1c is not.
  denominations: [100, 200]
  database: data/rare_coins.sqlite
  scarce_mintage: 200000
  flag_threshold: 0.80

pair:
  # The trays nest rather than meeting corner to corner, so their frames sit at
  # a fixed offset. This recovers it from the coins instead of measuring it.
  auto_align: true
  max_offset_mm: 8.0
  max_diameter_delta_mm: 1.2
  composite_face_px: 320

output_dir: data/out
save_crops: false
