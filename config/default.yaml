# euro-vision default configuration.
# Copy this file, edit, and pass with `euro-vision scan --config my.yaml`.

calibrate:
  # Rectify each photo to a metric top-down view using four coloured corner dots.
  # Turn this on once the tray is marked and measured.
  enabled: false
  # Clockwise as they appear in the photo, starting from the corner that should
  # become the top-left of the rectified image. Avoid yellow/orange (collides
  # with Nordic gold coins) and white/grey (collides with cupronickel).
  markers: [red, green, blue, magenta]
  # Measure these centre-to-centre between the dots, not the tray's outer edge.
  tray_width_mm: 200.0
  tray_height_mm: 150.0
  pixels_per_mm: 10.0
  min_marker_area: 40

segment:
  # "hough" needs no training and is the starting point for a fresh tray setup.
  # Switch to "yolo" once a detector has been trained on real tray images.
  backend: hough
  weights: models/segment.pt
  confidence: 0.25
  # Tune these two to your camera height — measure a coin in a sample photo.
  min_radius: 30
  max_radius: 120
  min_distance: 60
  crop_padding: 0.08
  # When calibrate.enabled is true these replace the pixel radii above, and the
  # three settings above stop needing to be tuned by hand.
  min_diameter_mm: 15.0
  max_diameter_mm: 27.0

normalise:
  size: 224
  circular_mask: true
  rotation_method: none
  # Set once the tray scale is known; enables physical diameter measurement,
  # which alone separates most Euro denominations.
  pixels_per_mm: null

classify:
  backend: stub
  weights: models/denomination.pt
  min_confidence: 0.5

rare:
  backend: none
  weights: models/embedding.pt
  database: data/rare_coins.sqlite
  flag_threshold: 0.80
  # Rare variants are most valuable on 1 and 2 euro coins.
  denominations: [100, 200]

output_dir: data/out
save_crops: true
