[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "euro-vision"
version = "0.1.0"
description = "Computer vision pipeline for automated Euro coin scanning and rare coin detection"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "opencv-python>=4.8",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
ml = [
    "torch>=2.1",
    "torchvision>=0.16",
    "ultralytics>=8.1",
]
dev = [
    "pytest>=7.4",
]
scrape = [
    "playwright>=1.49",
    "requests>=2.31",
]

[project.scripts]
euro-vision = "euro_vision.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
euro_vision = ["db/schema.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
